<style>
  .gate{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--paper)}

  .gate input{font-family:var(--mono);font-size:30px;letter-spacing:.5em;text-align:center;padding:10px 0 10px .5em;border:2px solid var(--ink);background:var(--paper);color:var(--ink);width:100%}
  .gate button{font-family:var(--cond);font-size:18px;letter-spacing:.12em;text-transform:uppercase;padding:12px;border:2px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer}
  .gate button:disabled{opacity:.6;cursor:wait}
  .gate .msg{min-height:1.4em;font-family:var(--mono);font-size:13px;color:var(--rust)}
  .gate a{font-family:var(--mono);font-size:12px;color:var(--ink-soft)}
</style>
